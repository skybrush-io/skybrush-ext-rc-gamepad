[project]
# Change this to the name of your own extension
name = "skybrush-ext-rc-gamepad"
version = "0.9.0"
description = "Enabling the usage of gamepads as remote controllers in Skybrush Server"
authors = [
  { name = "Tamas Nepusz", email = "tamas@collmot.com" },
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "hidapi>=0.14.0",
]

[dependency-groups]
dev = [
  "flockwave-server>2.17.5",
]

[project.entry-points."skybrush.server.ext"]
# Change this to the name of the folder in src/ containing your extension
rc_gamepad = "skybrush_ext_rc_gamepad"

[project.scripts]
skybrushd = "flockwave.server.launcher:start"
hid_test = "skybrush_ext_rc_gamepad.hid_test:main"

[[tool.uv.index]]
name = "fury"
url = "https://pypi.fury.io/skybrush/"

[tool.uv.sources]
flockwave-server = { index = "fury" }

[tool.ruff]
line-length = 80
lint.ignore = [
  "C901", # Function too complex
  "E501", # Line too long
  "S101", # assert
]
lint.select = [
  "B", # flake8-bugbear
  "C", # flake8-comprehensions
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort
  "S", # flake8-bandit
  "W", # pycodestyle warnings
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
